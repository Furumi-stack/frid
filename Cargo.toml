[workspace]
resolver = "3"
members = [
    "crates/federation-net",
    "crates/furumi-library",
    "crates/music-dht",
]

[workspace.package]
edition = "2024"
license = "WTFPL"
rust-version = "1.97"
repository = "https://gt.hexor.cy/ab/frid"

[workspace.dependencies]
federation-net = { path = "crates/federation-net", version = "0.3.1" }
music-dht = { path = "crates/music-dht", version = "0.4.1" }
iroh = "1"
iroh-base = "1"
iroh-tickets = "1"
mainline = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
blake3 = "1"
futures = "0.3"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "6"
lofty = "0.22"
data-encoding = "2"
rand = "0.9"
tempfile = "3"
